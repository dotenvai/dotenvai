name: dotenv.ai secret scan
description: Scan added lines for credentials before they reach your repository.
author: dotenv.ai
branding:
  icon: shield
  color: green
inputs:
  base:
    description: Base Git revision. For pull requests use github.event.pull_request.base.sha.
    required: false
  head:
    description: Head Git revision.
    required: false
    default: HEAD
  staged:
    description: Scan the staged diff instead of a revision range.
    required: false
    default: "false"
  fail-on:
    description: Finding severity that fails the check (any, high, or never).
    required: false
    default: high
runs:
  using: docker
  image: Dockerfile
